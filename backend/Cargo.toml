[package]
name = "epictask-backend"
version = "0.1.3"
edition = "2021"

[lib]
name = "epictask_backend"
path = "src/lib.rs"

[[bin]]
name = "epictask-backend"
path = "src/main.rs"

[[bin]]
name = "epictask-cli"
path = "src/bin/cli.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql", "chrono", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
jsonwebtoken = "9"
bcrypt = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
