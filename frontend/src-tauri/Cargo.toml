[package]
name = "epictask-desktop"
version = "0.1.0"
description = "EpicTask Desktop - Modern Project & Issue Tracking"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "epictask_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
